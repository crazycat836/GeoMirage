name: CI

on:
  # Every push on any branch runs the full suite, so a broken commit is
  # caught before it reaches a PR or a release.
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A push to main while a PR is open against the same branch would
# otherwise queue two redundant runs. Cancel any in-flight job on the
# same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  layer-check:
    name: Backend layer check (api -> core -> services)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python3 tools/check_layers.py

  ws-codegen-fresh:
    name: WS contract codegen is up-to-date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend deps
        # gen_ws_types.py imports api._errors → fastapi + core.device_manager
        # → pymobiledevice3, so the codegen step needs the full runtime
        # dependency set (not just pydantic+uvicorn as originally scoped).
        run: pip install -r backend/requirements.txt
      - name: Re-run codegen
        run: python3 tools/gen_ws_types.py
      - name: Diff against committed file
        run: |
          if ! git diff --exit-code -- frontend/src/generated/api-contract.ts; then
            echo "::error::frontend/src/generated/api-contract.ts is stale."
            echo "Run 'python3 tools/gen_ws_types.py' and commit the result."
            exit 1
          fi

  frontend:
    name: Frontend (tsc + vitest + vite build) — ${{ matrix.os }}
    # macOS also runs the osascript round-trip in
    # electron/backend-command.test.mjs, which is skipped elsewhere.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Single source of truth for the Node version is `engines.node`
          # in frontend/package.json — jsdom/vitest bump their minimum
          # Node on majors, and a pinned number here silently drifted.
          node-version-file: frontend/package.json
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: TypeScript type-check
        run: ./node_modules/.bin/tsc --noEmit -p tsconfig.json
      - name: TypeScript type-check (tests)
        # vitest only transpiles, so test files need their own tsc pass.
        run: ./node_modules/.bin/tsc --noEmit -p tsconfig.test.json
      - name: Vitest
        # Also runs electron/*.test.mjs (vitest's default include).
        run: npm test
      - name: Electron main/preload syntax check
        # main.js and preload.js need the Electron runtime, so no test
        # imports them; node --check at least catches a syntax error.
        run: for f in electron/*.js; do node --check "$f"; done
      - name: Vite production build
        # The packaged app ships this bundle (rolldown code splitting and
        # all); a dev server that works says nothing about it.
        run: ./node_modules/.bin/vite build

  backend:
    name: Backend (pytest) — ${{ matrix.os }}
    # The app ships for macOS, so the suite also runs there (lsof,
    # privilege-drop and pymobiledevice3 behave differently from Linux).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install runtime + test deps
        # No continue-on-error: a failed install must fail the job, not
        # let pytest run against a partial environment.
        run: pip install -r requirements.txt pytest pytest-asyncio
      - name: pytest
        run: python3 -m pytest tests -v

  backend-bundle:
    name: Backend PyInstaller bundle (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install runtime deps + PyInstaller
        run: pip install -r backend/requirements.txt pyinstaller
      - name: Build the backend bundle
        # Same path as a release build, minus Vite and electron-builder.
        run: python3 build.py --skip-frontend --skip-installer
      - name: Start the bundled backend and probe /
        run: |
          ./dist-py/geomirage-backend/geomirage-backend > backend.log 2>&1 &
          pid=$!
          for _ in $(seq 1 60); do
            if curl -fs http://127.0.0.1:8777/; then
              kill "$pid"
              exit 0
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          echo "::error::bundled backend did not answer on /"
          cat backend.log
          kill "$pid" 2>/dev/null || true
          exit 1
