version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Taipei
    # One PR per week instead of one per package; CI runs once.
    # Security updates ignore version-update groups, so give them their own
    # group; otherwise each vulnerable package opens a separate PR.
    groups:
      npm-all:
        patterns: ["*"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Taipei
    groups:
      pip-all:
        patterns: ["*"]
      pip-security:
        applies-to: security-updates
        patterns: ["*"]
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"
